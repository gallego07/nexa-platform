<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <h1 class="logo">NEXA</h1>
    <p class="slogan">Encuentra. Conecta. Resuelve.</p>

    <h2>Inicia sesión</h2>

    <ion-input
      type="email"
      label="Correo electrónico"
      labelPlacement="floating"
      fill="outline"
      [(ngModel)]="correo"
    ></ion-input>

    <ion-input
      type="password"
      label="Contraseña"
      labelPlacement="floating"
      fill="outline"
      [(ngModel)]="contrasena"
    ></ion-input>

    <ion-button
      expand="block"
      color="primary"
      [disabled]="!correo || !contrasena"
      (click)="iniciarSesion()"
    >
      Iniciar sesión
    </ion-button>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</ion-content>
